name: Build App

on:
  push:
    branches:
      - main
      - 'build-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    if: "contains(github.ref_name, 'android') || github.ref_name == 'main'"
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: |
          if [ -f "icons_launcher.yaml" ] && [ -f "assets/icon.png" ]; then
            echo "Generating app icons from assets/icon.png..."
            dart run icons_launcher:create || true
          fi

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release || true

      - name: Prepare Release Artifacts
        run: |
          mkdir -p build/dist
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk build/dist/app-release.apk
          fi
          if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            cp build/app/outputs/bundle/release/app-release.aab build/dist/app-release.aab
          fi
          ls -la build/dist

      - name: Get Build Info
        id: info
        run: |
          BUILD_TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            BUILD_TAG="build-${GITHUB_RUN_ID}"
          fi
          echo "tag=${BUILD_TAG}" >> $GITHUB_OUTPUT
          echo "tag: ${BUILD_TAG}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/dist/app-release.apk
          retention-days: 14

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-bundle
          path: build/dist/app-release.aab
          retention-days: 14

      - name: Create GitHub Release with Android Package
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/build-') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: release-${{ steps.info.outputs.tag }}-${{ github.run_number }}
          name: Release ${{ steps.info.outputs.tag }} (Build #${{ github.run_number }})
          body: |
            Automated Android build generated by ieWebNative Cloud Builder.
            - Commit: ${{ github.sha }}
            - Workflow Run: ${{ github.run_id }}
          files: |
            build/dist/app-release.apk
            build/dist/app-release.aab

  build-windows:
    name: Build Windows Application
    runs-on: windows-2022
    if: "contains(github.ref_name, 'windows') || github.ref_name == 'main'"
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up NuGet
        uses: nuget/setup-nuget@v2

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate App Icons
        shell: pwsh
        run: |
          if (Test-Path "icons_launcher.yaml") {
            dart run icons_launcher:create
          }

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Package Windows Release (.zip)
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          if (Test-Path $releaseDir) {
            New-Item -ItemType Directory -Force -Path "build\dist"
            Compress-Archive -Path "$releaseDir\*" -DestinationPath "build\dist\windows-app.zip" -Force
            Write-Host "Successfully packaged build\dist\windows-app.zip"
          } else {
            Write-Error "Release directory not found: $releaseDir"
            exit 1
          }

      - name: Get Build Info
        id: info
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          if ("${env:GITHUB_REF_TYPE}" -ne "branch") {
            $tag = "build-${env:GITHUB_RUN_ID}"
          }
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "tag=$tag`n", [System.Text.Encoding]::UTF8)
          Write-Host "tag: $tag"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/dist/windows-app.zip
          retention-days: 14

      - name: Create GitHub Release with Windows App
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/build-') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: release-${{ steps.info.outputs.tag }}-${{ github.run_number }}
          name: Release ${{ steps.info.outputs.tag }} (Build #${{ github.run_number }})
          body: |
            Automated Windows desktop build generated by ieWebNative Cloud Builder.
            - Commit: ${{ github.sha }}
            - Workflow Run: ${{ github.run_id }}
          files: |
            build/dist/windows-app.zip

  build-macos:
    name: Build macOS Application (.dmg)
    runs-on: macos-14
    if: "contains(github.ref_name, 'macos') || github.ref_name == 'main'"
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: |
          if [ -f "icons_launcher.yaml" ] && [ -f "assets/icon.png" ]; then
            dart run icons_launcher:create || true
          fi

      - name: Build macOS Application
        run: flutter build macos --release

      - name: Package macOS DMG and ZIP
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/dist"
          APP_NAME=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 -exec basename {} .app \;)
          if [ -z "$APP_NAME" ]; then APP_NAME="App"; fi
          echo "Packaging application: $APP_NAME"

          hdiutil create -volname "$APP_NAME" -srcfolder "build/macos/Build/Products/Release/$APP_NAME.app" -ov -format UDZO "$GITHUB_WORKSPACE/build/dist/$APP_NAME.dmg" || true
          if [ ! -f "$GITHUB_WORKSPACE/build/dist/$APP_NAME.dmg" ]; then
            hdiutil create -volname "$APP_NAME" -srcfolder "build/macos/Build/Products/Release" -ov -format UDZO "$GITHUB_WORKSPACE/build/dist/$APP_NAME.dmg" || true
          fi

          (cd build/macos/Build/Products/Release && zip -r "$GITHUB_WORKSPACE/build/dist/$APP_NAME-macos.zip" "$APP_NAME.app") || true

          ls -la "$GITHUB_WORKSPACE/build/dist"

      - name: Get Build Info
        id: info
        run: |
          BUILD_TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            BUILD_TAG="build-${GITHUB_RUN_ID}"
          fi
          echo "tag=${BUILD_TAG}" >> $GITHUB_OUTPUT
          echo "tag: ${BUILD_TAG}"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-dmg
          path: build/dist/*.dmg
          retention-days: 14

      - name: Upload macOS ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-zip
          path: build/dist/*.zip
          retention-days: 14

      - name: Create GitHub Release with macOS App
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/build-') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: release-${{ steps.info.outputs.tag }}-${{ github.run_number }}
          name: Release ${{ steps.info.outputs.tag }} (Build #${{ github.run_number }})
          body: |
            Automated macOS build generated by ieWebNative Cloud Builder.
            - Commit: ${{ github.sha }}
            - Workflow Run: ${{ github.run_id }}
          files: |
            build/dist/*.dmg
            build/dist/*.zip

  build-linux:
    name: Build Linux Application
    runs-on: ubuntu-latest
    if: "contains(github.ref_name, 'linux') || github.ref_name == 'main'"
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: |
          if [ -f "icons_launcher.yaml" ] && [ -f "assets/icon.png" ]; then
            dart run icons_launcher:create || true
          fi

      - name: Build Linux Application
        run: flutter build linux --release

      - name: Package Linux Application
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/dist"
          (cd build/linux/x64/release/bundle && tar -czvf "$GITHUB_WORKSPACE/build/dist/linux-app.tar.gz" . && zip -r "$GITHUB_WORKSPACE/build/dist/linux-app.zip" .) || true
          ls -la "$GITHUB_WORKSPACE/build/dist"

      - name: Get Build Info
        id: info
        run: |
          BUILD_TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            BUILD_TAG="build-${GITHUB_RUN_ID}"
          fi
          echo "tag=${BUILD_TAG}" >> $GITHUB_OUTPUT
          echo "tag: ${BUILD_TAG}"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            build/dist/linux-app.tar.gz
            build/dist/linux-app.zip
          retention-days: 14

      - name: Create GitHub Release with Linux App
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/build-') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: release-${{ steps.info.outputs.tag }}-${{ github.run_number }}
          name: Release ${{ steps.info.outputs.tag }} (Build #${{ github.run_number }})
          body: |
            Automated Linux desktop build generated by ieWebNative Cloud Builder.
            - Commit: ${{ github.sha }}
            - Workflow Run: ${{ github.run_id }}
          files: |
            build/dist/linux-app.tar.gz
            build/dist/linux-app.zip

  build-ios:
    name: Build iOS Application
    runs-on: macos-14
    if: "contains(github.ref_name, 'ios') || github.ref_name == 'main'"
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: |
          if [ -f "icons_launcher.yaml" ] && [ -f "assets/icon.png" ]; then
            dart run icons_launcher:create || true
          fi

      - name: Build iOS Application (Signed or Export)
        id: build_ios
        run: |
          set -e
          mkdir -p build/dist

          # Check if Apple credentials are provided in ios_signing directory
          if [ -f "ios_signing/certificate.p12" ] && [ -f "ios_signing/profile.mobileprovision" ]; then
            echo "Apple signing credentials detected. Preparing secure keychain..."

            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
            KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            CERT_PASS=""
            if [ -f "ios_signing/password.txt" ]; then
              CERT_PASS=$(cat ios_signing/password.txt)
            fi

            security import "ios_signing/certificate.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASS" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            PROFILE_UUID=$(strings ios_signing/profile.mobileprovision | grep -A1 '<key>UUID</key>' | tail -n1 | sed -e 's/.*<string>//' -e 's/<\/string>.*//')
            cp ios_signing/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
            echo "Installed profile UUID: $PROFILE_UUID"

            TEAM_ID=$(strings ios_signing/profile.mobileprovision | grep -A1 '<key>TeamIdentifier</key>' | tail -n1 | sed -e 's/.*<string>//' -e 's/<\/string>.*//')
            PROFILE_NAME=$(strings ios_signing/profile.mobileprovision | grep -A1 '<key>Name</key>' | tail -n1 | sed -e 's/.*<string>//' -e 's/<\/string>.*//')

            BUNDLE_ID=$(grep -m1 "PRODUCT_BUNDLE_IDENTIFIER" ios/Runner.xcodeproj/project.pbxproj | tr -d ' \t;' | cut -d'=' -f2 || echo "com.example.app")

            echo '<?xml version="1.0" encoding="UTF-8"?>' > ExportOptions.plist
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> ExportOptions.plist
            echo '<plist version="1.0">' >> ExportOptions.plist
            echo '<dict>' >> ExportOptions.plist
            echo '    <key>method</key>' >> ExportOptions.plist
            echo '    <string>app-store</string>' >> ExportOptions.plist
            echo "    <key>teamID</key>" >> ExportOptions.plist
            echo "    <string>$TEAM_ID</string>" >> ExportOptions.plist
            echo '    <key>provisioningProfiles</key>' >> ExportOptions.plist
            echo '    <dict>' >> ExportOptions.plist
            echo "        <key>$BUNDLE_ID</key>" >> ExportOptions.plist
            echo "        <string>$PROFILE_NAME</string>" >> ExportOptions.plist
            echo '    </dict>' >> ExportOptions.plist
            echo '    <key>signingCertificate</key>' >> ExportOptions.plist
            echo '    <string>Apple Distribution</string>' >> ExportOptions.plist
            echo '    <key>signingStyle</key>' >> ExportOptions.plist
            echo '    <string>manual</string>' >> ExportOptions.plist
            echo '    <key>stripSwiftSymbols</key>' >> ExportOptions.plist
            echo '    <true/>' >> ExportOptions.plist
            echo '    <key>compileBitcode</key>' >> ExportOptions.plist
            echo '    <false/>' >> ExportOptions.plist
            echo '</dict>' >> ExportOptions.plist
            echo '</plist>' >> ExportOptions.plist

            echo "Building signed IPA with ExportOptions.plist..."
            if flutter build ipa --release --export-options-plist=ExportOptions.plist; then
              find build/ios/ipa -name "*.ipa" -exec cp {} build/dist/app-release.ipa \;
              echo "Signed IPA build succeeded!"
            else
              echo "Signed IPA build fallback to unsigned export..."
              flutter build ios --release --no-codesign
              mkdir -p Payload
              cp -r build/ios/iphoneos/Runner.app Payload/
              zip -r build/dist/app-release.ipa Payload
              rm -rf Payload
            fi

            security delete-keychain "$KEYCHAIN_PATH" || true
          else
            echo "No signing credentials provided. Building unsigned iOS app & TestFlight Xcode project..."
            flutter build ios --release --no-codesign

            mkdir -p Payload
            cp -r build/ios/iphoneos/Runner.app Payload/
            zip -r build/dist/app-release.ipa Payload
            rm -rf Payload
          fi

          echo "Packaging Xcode project for TestFlight..."
          zip -r build/dist/xcode-project.zip ios/
          echo "Build artifacts ready in build/dist:"
          ls -la build/dist

      - name: Get Build Info
        id: info
        run: |
          BUILD_TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            BUILD_TAG="build-${GITHUB_RUN_ID}"
          fi
          echo "tag=${BUILD_TAG}" >> $GITHUB_OUTPUT
          echo "tag: ${BUILD_TAG}"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-release
          path: build/dist/app-release.ipa
          retention-days: 14

      - name: Upload Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-project
          path: build/dist/xcode-project.zip
          retention-days: 14

      - name: Create GitHub Release with iOS App
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/build-') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: release-${{ steps.info.outputs.tag }}-${{ github.run_number }}
          name: Release ${{ steps.info.outputs.tag }} (Build #${{ github.run_number }})
          body: |
            Automated iOS build generated by ieWebNative Cloud Builder.
            - Commit: ${{ github.sha }}
            - Workflow Run: ${{ github.run_id }}
          files: |
            build/dist/app-release.ipa
            build/dist/xcode-project.zip
